name: Build XTV Lite Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Extrair ZIP automaticamente se enviado em arquivo único
        run: |
          if [ ! -d "android-tv" ] && ls *.zip >/dev/null 2>&1; then
            unzip -o "*.zip"
          fi

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug (Ultraleve 1GB RAM)
        working-directory: ./android-tv
        run: gradle assembleDebug --no-daemon

      - name: Enviar APK para Download nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XTV-Lite-AndroidTV-APK
          path: android-tv/app/build/outputs/apk/debug/*.apk
